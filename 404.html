<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Probox Studio Portfolio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Probox Studio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Probox Studio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121212;
    }

    #boot-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #121212;
      transition: opacity 0.28s ease;
    }

    #boot-screen.boot-screen--hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
  <script>
    (function () {
      var host = location.hostname;
      if (host !== 'localhost' && host !== '127.0.0.1') {
        return;
      }

      document.write('<script src="app_check_debug.js"><\/script>');
    })();
  </script>
</head>
<body>
  <div id="boot-screen" aria-hidden="true"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var bootScreen = document.getElementById('boot-screen');
      if (!bootScreen) {
        return;
      }

      bootScreen.classList.add('boot-screen--hide');
      window.setTimeout(function () {
        bootScreen.remove();
      }, 1000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
